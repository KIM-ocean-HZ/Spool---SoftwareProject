[package]
name = "spool"
version = "0.6.2"
description = "Spool — context hub for long-running projects"
edition = "2021"

[lib]
name = "spool_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-store = "2"
tauri-plugin-fs = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
# Guarantees a single running instance: a second launch hands off to the running one and
# exits BEFORE opening sqlite:spool.db, so two processes can never contend for the DB
# (the "database is locked" + data-wipe incident, 2026-05-29). Desktop-only.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# §20.12 MCP local server (`spool --mcp`): read-only SQLite access from the stdio
# subprocess, outside the Tauri runtime. rusqlite 0.32 rides the same libsqlite3-sys
# 0.30 line tauri-plugin-sql's sqlx already compiles (`links = "sqlite3"` allows one
# copy in the graph). libc: localtime_r so pack timestamps render in local time,
# matching the frontend's formatPackTime.
rusqlite = "0.32"
libc = "0.2"
# 2026-07-31 决策① (DESIGN_MCP_ONECLICK §0, Ocean 批): ChatGPT 桌面版 / Codex CLI 的
# ~/.codex/config.toml 一键接入。toml_edit 而非 toml:round-trip 保留用户文件的注释与
# 格式,merge 一个表不重排整个文件。
toml_edit = "0.25.11"

# macOS-only: a CGEventTap in ListenOnly mode watches FlagsChanged events to detect a
# double-tap of ⌥ (Option) as the capture trigger. PLAN §4 deps list amended per user
# approval to allow this; a CGEventTap is required because a bare modifier key cannot
# be registered as a RegisterEventHotKey global shortcut. foreign-types exposes the raw
# CGEventRef so we can read each event's CGEventGetTimestamp — measuring the tap
# interval by hardware time (not callback-delivery time) is what keeps detection
# reliable when the system is busy (app switch, or a heavy app like Word).
[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.23"
core-foundation = "0.9"
foreign-types = "0.5"
# 2026-08-23（E3 前置，Ocean 拍的是「加 security-framework」那一档）：API key 挪进
# 系统钥匙串。在此之前它是 app_config_dir 下一个 0600 的文件 —— 挡得住「settings.json
# 被拷走」，挡不住「同一个账号下的别的程序去读它」。
#
# ⚠️⚠️ **这个 crate 不碰网络，加它不破 §4.2 那条护栏。** 它是 macOS 自带
# Security.framework 的薄绑定（SecItemAdd / SecItemCopyMatching），全部符号来自系统。
# 加完之后那条护栏照旧验得过，⛔ 每次动这个文件都要再跑一次：
#   cargo tree -e normal | grep -iE "ureq|rustls|reqwest|hyper|openssl"   # 必须是空的
#
# ⛔ 只加 macOS 这一档。Windows 继续用 0600 文件（那边本来就还没签名，不是当前战场），
# 换成跨平台的 `keyring` 会把 dbus/secret-service 拖进依赖树 —— Ocean 明确否了那一档。
security-framework = "2"

# Windows-only: the two things the port cannot fake (see win32.rs).
#   - BCryptGenRandom, because MCP ids came from /dev/urandom and that device does not
#     exist on Windows — read tools would work and every write would fail at id time.
#   - GetForegroundWindow → pid → executable, because `get_foreground_app` returned None
#     off macOS and every Windows capture would land with a blank source.
# Version 0.61 on purpose: tauri already pulls that exact one into the graph, so this
# adds API surface rather than a second copy of the crate.
[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security_Cryptography",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input",
    # GetLastInputInfo — the machine-wide idle clock the break-reminder criterion runs on
    # (capture::system_idle_ms). GetTickCount64 is the clock it reports against.
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }
